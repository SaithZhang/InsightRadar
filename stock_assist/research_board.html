x solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left;font-size:13px}th{font-size:11px;color:var(--muted);font-weight:500;background:#fafbf8}td,th{padding:13px 18px;border-bottom:1px solid #e8ede5}tr:last-child td{border-bottom:0}.num{font-variant-numeric:tabular-nums;text-align:right}.sub{font-size:11px;color:var(--muted);display:block}.lookup-grid{display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px;align-items:start}.research-list{display:grid;gap:10px}.research-item{display:block;text-align:left;padding:15px;background:#fff;border:1px solid var(--line);border-radius:10px;width:100%;font-weight:400}.research-item.selected{border-color:#55775d;background:#edf3e5;box-shadow:inset 3px 0 #55775d}.research-item b{display:block;font-size:14px;margin:7px 0;font-weight:550}.research-item small{color:var(--muted);font-size:11px}.detail{background:white;border:1px solid var(--line);border-radius:12px;min-width:0}.detail-head{padding:23px;border-bottom:1px solid var(--line)}.detail-head h2{font-size:23px;margin:8px 0}.detail-head p{color:var(--muted);font-size:13px;margin:10px 0}.actions{display:flex;flex-wrap:wrap;gap:8px}.detail-body{padding:23px}.detail-body h3{font-size:14px;margin:24px 0 12px}.detail-body h3:first-child{margin-top:0}.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.plan-cell{padding:15px;border:1px solid var(--line);border-radius:8px;background:#fcfdfb;min-width:0}.plan-cell label{font-size:11px;color:var(--muted);display:block;margin-bottom:6px}.pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.gap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #edf0e9;font-size:13px}.gap.resolved{color:var(--muted)}.evidence{padding:15px 0;border-bottom:1px solid var(--line)}.evidence summary{cursor:pointer;font-size:13px;overflow-wrap:anywhere}.evidence p{white-space:pre-wrap;font-size:12px;color:#5d7065;overflow-wrap:anywhere}.evidence-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:7px}.history-row{padding:15px 0;border-bottom:1px solid var(--line)}.history-row summary{cursor:pointer;display:list-item}.history-row small{display:block;color:var(--muted);font-size:11px}.history-row p{font-size:12px;color:#5d7065}.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;min-width:0}.panel h3{font-size:15px;margin:0 0 15px}.empty{padding:36px 24px;text-align:center;color:var(--muted);border:1px dashed #c7d5c5;border-radius:12px;grid-column:1/-1}.empty b{font-size:17px;color:var(--ink);display:block;margin-bottom:9px}.empty p{font-size:13px}.event{border-left:2px solid #d7e0cf;padding:0 0 22px 17px;position:relative}.event:before{content:'';width:7px;height:7px;border-radius:50%;background:#6a8c68;position:absolute;left:-4.5px;top:7px}.event b{font-size:13px;font-weight:550}.event p{font-size:12px;color:var(--muted);margin:6px 0}.event small{font-size:11px;color:var(--muted)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:block;font-size:12px;color:var(--muted);margin-bottom:14px}.field input,.field textarea,.field select{display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid #cdd9ca;background:#fbfcfa;border-radius:7px;color:var(--ink);min-width:0}.field textarea{min-height:88px;resize:vertical}.field small{display:block;margin-top:5px;font-size:11px}.field.wide{grid-column:1/-1}dialog{padding:0;border:1px solid var(--line);border-radius:15px;width:min(700px,calc(100vw - 30px));max-height:90vh;color:var(--ink);box-shadow:0 30px 100px #16352744}dialog::backdrop{background:#172e2766;backdrop-filter:blur(3px)}.modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:19px;margin:0}.modal-content{padding:22px 24px}.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding-top:10px}.form-error{color:var(--red);font-size:13px;white-space:pre-wrap}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#193d33;color:white;padding:12px 22px;border-radius:8px;z-index:10;max-width:90vw;box-shadow:0 4px 24px #0002}.footer-note{color:var(--muted);font-size:11px;margin:26px 0 0}.search{width:100%;padding:10px 12px;background:white;border:1px solid var(--line);border-radius:8px;margin-bottom:12px}.loading{padding:80px 20px;text-align:center;color:var(--muted)}.hidden{display:none!important}

.coverage-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}.coverage-grid .evidence{margin:0;overflow-wrap:anywhere}.discovery-panel .actions button{text-align:left;white-space:normal}.discovery-panel .actions{flex-wrap:wrap}@media(max-width:900px){.coverage-grid{grid-template-columns:1fr}}
.change-check{padding-bottom:22px;margin-bottom:22px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.change-check .section-head{margin-top:0}.change-check h3{margin-top:20px}.change-check .section-head .badge{max-width:65%;text-align:right}

<body>
<div class="app">
 <aside class="sidebar"><div class="brand"><div class="brand-mark">IR</div>InsightRadar</div><small>个人投资研究工作台</small>
  <nav class="nav" aria-label="主要任务"><a href="#today" data-route="today"><span>◫</span>今日工作台</a><a href="#portfolio" data-route="portfolio"><span>◉</span>组合风险</a><a href="#lookup" data-route="lookup"><span>⌕</span>标的研究</a><a href="#review" data-route="review"><span>↺</span>复盘账本</a></nav>
  <div class="side-bottom"><b>让下一步，有据可循。</b>本机保存 · 人工决策<br><a href="/report#today">打开原有分析工作台 ↗</a></div>
 </aside>
 <main class="content"><header class="topbar"><div><div class="crumb">InsightRadar / 决策工作空间</div><h1 id="page-title">今日工作台</h1></div><div class="top-actions"><span class="local">仅在本机</span><button id="reload">刷新状态</button><button id="new-research">＋ 指定研究</button><button class="primary" id="discover">隔夜机会发现</button></div></header><div id="app" class="loading">正在读取你的研究与持仓…</div></main>
</div>
<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" aria-label="关闭对话框">✕</button></div><div class="modal-content" id="modal-body"></div></dialog><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
'use strict';
let board=null, selected=null, route='today', modalRevision=0, timer=null;
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v===null||v===undefined?'未提供':Number(v).toLocaleString('zh-CN',{maximumFractionDigits:2});
const stamp=v=>String(v||'日期未提供').replace('T',' ').slice(0,19);
const link=(url,title)=>{if(!url)return esc(title)+'（未提供链接）';try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))return esc(title);return `<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">${esc(title)} ↗</a>`}catch{return esc(title)}};
const names={today:'今日工作台',portfolio:'组合风险',lookup:'标的研究',review:'复盘账本'};
const kinds={fact:'事实',inference:'推断',rumor:'传闻',sentiment:'观点',unknown:'待核验'};
const stances={supports:'支持',opposes:'反证',mixed:'支持与反证并存',context:'背景'};
const verbs={create:'发起研究',revise:'修订预案',evidence:'补充证据',gap:'记录缺口',freeze:'冻结观察版',status:'调整状态',review:'记录复盘',change_check:'变化核验'};
const states={watch:'持续观察',paused:'暂停跟进',invalidated:'已失效',closed:'已结束'};
function status(c){return c.expired?'预案已到期':c.status==='watch'?(c.open_gaps?'待补证据':'待人工复核'):states[c.status]}
function badge(c){if(c.change_check)return changeBadge(c.change_check);return `<span class="badge ${c.expired||c.status==='invalidated'?'danger':c.open_gaps?'warn':''}">${esc(status(c))}</span>`}
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.add('hidden'),5000)}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',cache:'no-store',headers:{'Content-Type':'application/json','X-InsightRadar-Token':$('meta[name="insightradar-session-token"]').content},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error||'操作未完成');return d}
async function load(){board=await api('/api/research-board');if(!selected&&board.cards.length)selected=board.cards[0].id;render()}
function current(){return board.cards.find(c=>c.id===selected)||board.cards[0]}
function changeBadge(check){
  const a=check.assessment;
  return `<span class="badge ${check.stale||a.status==='insufficient_coverage'?'warn':a.status==='needs_review'?'danger':''}">${esc(check.stale?'旧核验 · 待更新':a.status_label)}</span>`;
}
function changeMetrics(a){
  const names={net_profit:'归母净利润',operating_cash_flow:'经营现金流净额'};
  return `<div class="plan-grid">${Object.entries(a.metrics).map(([key,m])=>`<div class="plan-cell"><label>${names[key]} · 本期 / 上年同期</label><div class="pre"><strong>${(Number(m.current)/1e8).toFixed(2)} / ${(Number(m.previous)/1e8).toFixed(2)} 亿元</strong><br>同比 ${m.yoy_pct===null?'基数非正，仅比较金额':(m.yoy_pct>0?'+':'')+m.yoy_pct.toFixed(2)+'%'}<br><span class="sub">${esc(m.period)}<br>对比 ${esc(m.comparison_period)}</span></div></div>`).join('')}</div>`;
}
function changeEvidence(a){
  return Object.values(a.metrics).map(m=>{
    const s=a.sources.find(s=>s.id===m.source_id);
    return `<details class="evidence"><summary>${esc(s.title)} · 第 ${esc(s.page)} 页 · 原表摘录</summary><p>${esc(m.quote)}</p>${link(s.url,'打开原始公告')}<span class="sub">披露 ${esc(s.published_at)}</span></details>`;
  }).join('');
}
function changeSection(c){
  const check=c.change_check;if(!check)return '';
  const a=check.assessment;
  const explanation=a.explanation;
  const source=explanation&&a.sources.find(s=>s.id===explanation.source_id);
  return `<section class="change-check"><div class="section-head"><h3>持仓变化核验</h3>${changeBadge(check)}</div>
    ${check.stale?'<div class="alert">核验日期或原理由已变化，以下保留为历史结果，需补充材料后重新核验。</div>':''}
    <div class="sub">核验 ${stamp(a.as_of)}（北京时间） · ${link(a.holding.url,'持仓／自选记录 '+a.holding.as_of)}</div>
    <h3>原理由与观察条件</h3><div class="pre">${esc(a.thesis.text)}</div>
    <p class="sub">${link(a.thesis.url,'理由记录 '+a.thesis.as_of)} · 本次仅核验其中的利润与现金流。</p>
    <h3>这次发现了什么</h3>${changeMetrics(a)}
    <div class="alert ${a.status==='no_material_change'?'quiet':''}"><b>${esc(a.summary)}</b><div>下一步：${esc(a.next_check)}</div></div>
    ${explanation?`<p class="pre">公司解释：“${esc(explanation.quote)}”</p><p class="sub">${link(source.url,'公司原文，第 '+source.page+' 页')}。这是公司的归因；本次不能据此确认订单或需求反转。</p>`:''}
    <p class="pre">${esc(a.scope)}</p><p class="sub">${esc(a.coverage.note)}</p>
    ${a.gaps.length?`<div class="alert">${a.gaps.map(esc).join('<br>')}</div>`:''}
    <details class="evidence"><summary>核验依据与判定范围</summary><p>${esc(a.rule_text)}</p><p>${check.filing?'模型提取后经审阅采纳。采纳时间 '+stamp(check.filing.reviewed_at)+'。':'由已核对材料导入。'}程序校验引文、金额和期间并计算同比。</p>${changeEvidence(a)}</details>
    ${check.validation_cases.length?`<details class="evidence" data-change-validation><summary>三种状态验证 · 当前实际材料＋两项验证场景</summary><div class="plan-cell"><b>当前实际材料</b><p>${esc(a.status_label)} · ${esc(a.summary)}</p></div>${check.validation_cases.map(v=>`<div class="plan-cell" style="margin-top:10px"><b>${esc(v.mode_label)} · ${esc(v.status_label)}</b><p>${esc(v.scope)}</p><p>${esc(v.summary)}</p>${changeMetrics(v)}${changeEvidence(v)}</div>`).join('')}<p>历史与缺源场景只验证状态处理，不覆盖当前实际材料结果。</p></details>`:''}
  </section>`;
}
function changeModal(){
  return openModal('导入已核对的变化材料',`<p class="sub">选择与当前证券代码及原理由一致的材料包。保存会核对来源、引文、金额与同比期间，并保留旧版本。</p><label class="field">核对材料（JSON）<input type="file" name="packet_file" accept="application/json,.json" required></label>`,async()=>{
    const file=document.querySelector('[name="packet_file"]').files[0];

function filingModal(){

function claimEvidence(c, claims, gap, run){

 return `<section class="claim-evidence"><h3>逐条主张与原文</h3>${rows||'<p class="sub">旧版草稿未逐项绑定原文，保留供回查，不计为已核实结论。</p>'}${gap?`<div class="alert"><b>反证覆盖缺口</b><p>${esc(gap)}</p></div>`:''}</section>`;
}
function detail(c){if(!c)return blank('研究可以从一句话开始','例如：机器人回调是否值得关注，对我的组合有什么影响？');const job=c.job;return `<article class="detail"><div class="detail-head"><div class="card-top"><span class="symbols">${c.origin==='discovery'?'自主发现':c.origin==='holding_change'?'持仓变化':c.origin==='manual_case'?'人工案例':'指定研究'} · ${esc(c.symbols.join(' / '))||'标的待核验'} · v${c.version}</span>${badge(c)}</div><h2>${c.origin==='discovery'?'归档线索 · ':''}${esc(c.title)}</h2><p>${esc(c.question)}</p><div class="sub">${c.origin==='discovery'?'发现截止日':'价格/资料基准'} ${esc(c.as_of)} · 有效至 ${esc(c.valid_until)} · 更新 ${stamp(c.updated_at)}</div><div class="actions" style="margin-top:15px"><button class="primary" data-action="material">＋ 补充证据</button>${c.symbols.length===1&&c.thesis?'<button data-action="filing">从公告生成草稿</button><button data-action="change">导入已核对材料</button>':''}<button data-action="edit">编辑预案</button><button data-action="freeze">冻结观察版</button><button data-action="review">记录复盘</button><button data-action="status">调整状态</button></div></div><div class="detail-body">${filingSection(c)}${changeSection(c)}${c.expired?'<div class="alert">预案已到期，仅供历史复盘。续查时请核验新材料并保存新版本，旧价格不会自动续用。</div>':''}<h3>${c.discovery_update?.review_note?'原始发现草稿（更正见下方）':c.origin==='discovery'?'AI 推断 · 待核验':'当前判断'}</h3>${c.origin==='discovery'?'<div class="alert">AI发现候选，尚未独立核验。下列数字、订单、资金身份均是归档中的说法；引用存在不代表事实已确认。</div>':''}<div class="pre">${esc(c.thesis||'尚无结论。先检索原始资料，再逐项核验。')}</div>${c.origin==='discovery'?claimEvidence(c,c.discovery_claims,c.discovery_counter_gap??'旧版草稿未记录反证覆盖；需重新核验',c.discovery_run):''}<h3>可检查的条件</h3><div class="plan-grid">${[['entry','什么条件下考虑入场'],['invalidation','什么情况下放弃'],['exit','如何退出 / 到期处理'],['holding_relation','与持仓和资金的关系']].map(([k,n])=>`<div class="plan-cell"><label>${n}</label><div class="pre">${esc(c[k]||'待定义，不生成操作数量')}</div></div>`).join('')}</div><div class="section-head"><h3>证据缺口 · ${c.open_gaps} 项待补</h3><button class="link" data-action="gap">＋ 添加缺口</button></div>${c.gaps.map(g=>`<div class="gap ${g.resolved_by?'resolved':''}"><span>${g.resolved_by?'✓ 已由用户补证 · ':'○ '}${esc(g.text)}</span>${!g.resolved_by?`<button class="link" data-gap="${g.id}">补证据</button>`:''}</div>`).join('')||'<div class="sub">未登记缺口不代表已经通过核验。</div>'}${c.discovery_update?`<div class="alert quiet"><h3>${c.discovery_update.review_note?'冻结案例审阅更正 · 非自动验收通过':'最新隔夜发现补充 · 待核验'}</h3>${c.discovery_update.review_note?`<p>${esc(c.discovery_update.review_note)}</p>`:''}<p>归档线索 · ${esc(c.discovery_update.title||'继续这条研究')}</p><div class="sub">本次 AI 推断 · 待核验</div><div class="pre">${esc(c.discovery_update.reason)}</div>${claimEvidence(c,c.discovery_update.claims,c.discovery_update.counter_evidence_gap,c.discovery_update.run_id)}<p>下一步核验：${esc(c.discovery_update.next_check)}</p><small>本次引用对应运行 ${esc(c.discovery_update.run_id)}；原预案保留。</small></div>`:''}<div class="section-head"><h3>依据与反证 · ${c.evidence.length}</h3></div><div class="actions"><button data-action="collect" ${job?.status==='running'?'disabled':''}>检索现有归档</button><button data-action="ai" ${job?.status==='running'?'disabled':''}>用现有 Agent 核验</button></div><p class="sub">归档检索不调用模型。Agent 沿用现有配置，最多4次请求 / 120秒 / 本地估算额度 $0.10；草稿需复核。</p>${job?`<div class="alert quiet">${job.status==='running'?'正在研究… ':''}${esc(job.message)}<span class="sub">${stamp(job.finished_at||job.started_at)}${job.run_id?' · '+esc(job.run_id):''}</span></div>`:''}${c.ai_draft?`<details class="evidence"><summary>AI 核验草稿 · 尚未采纳</summary><p>${esc(c.ai_draft.note)}</p><div class="pre">${esc(JSON.stringify(c.ai_draft.answer,null,2))}</div></details>`:''}${c.evidence.length?c.evidence.slice().reverse().map(e=>`<details class="evidence"><summary><div class="evidence-meta"><span class="badge ${e.stance==='opposes'?'danger':''}">${esc(kinds[e.kind]||'待核验')} · ${esc(stances[e.stance]||'背景')}</span><span>${esc(e.as_of)}</span>${e.period?`<span class="badge ${e.period==='context'?'warn':''}">${e.period==='context'?'历史背景':'隔夜新增观点 / 材料'}</span>`:''}${e.truncated?'<span>原文有截断</span>':''}${e.source_ref?`<span>引用 ${esc(e.source_ref)}${e.run_id?' · '+esc(e.run_id):''}</span>`:''}</div>${esc(e.title)}</summary><p>${esc(e.text)}</p>${link(e.url,'查看原文')}<span class="sub">保存于 ${stamp(e.added_at)}${e.origin==='pilot_archive'?' · 本地归档片段，覆盖有限':''}</span></details>`).join(''):'<p class="sub">还没有材料。可以检索现有归档，或补充视频观点、公告、研报、行情证据。</p>'}<h3>版本与接续记录</h3>${c.history.slice().reverse().map(h=>`<details class="history-row"><summary>v${h.version} · ${esc(verbs[h.action]||h.action)}<small>${stamp(h.at)} · ${esc(h.note)}</small></summary><div class="plan-grid">${[['thesis','当时判断'],['entry','当时入场条件'],['invalidation','当时失效条件'],['exit','当时退出规则']].map(([k,n])=>`<div class="plan-cell"><label>${n}</label><div class="pre">${esc(h.snapshot[k]||'未定义')}</div></div>`).join('')}</div>${h.snapshot.change_check?`<p>当时变化核验：${esc(h.snapshot.change_check.assessment.status_label)} · ${esc(h.snapshot.change_check.assessment.summary)}</p>`:''}<p>当时材料 ${h.snapshot.evidence?.length||0} 条 · 未补缺口 ${(h.snapshot.gaps||[]).filter(g=>!g.resolved_by).length} 项</p></details>`).join('')}<p class="footer-note">冻结保存当时的观察条件和缺口，不表示条件已触发。新买入境内股票与股票 ETF 受 T+1 约束；止损价不保证实际成交价。</p></div></article>`}
function lookup(){return `<section data-route-panel="lookup"><div class="lookup-grid"><div><input class="search" id="filter" placeholder="筛选方向 / 证券代码" aria-label="筛选研究"><div class="research-list">${board.cards.map(c=>`<button class="research-item ${c.id===current()?.id?'selected':''}" data-select="${c.id}" data-search="${esc(c.title+' '+c.symbols.join(' '))}">${badge(c)}<b>${esc(c.title)}</b><small>${esc(c.symbols.join(' / '))} · v${c.version}</small></button>`).join('')}</div></div>${detail(current())}</div></section>`}
function review(){const reviews=board.cards.flatMap(c=>c.reviews.map(r=>({...r,title:c.title,id:c.id}))).sort((a,b)=>b.at.localeCompare(a.at));return `<section data-route-panel="review"><div class="hero"><div><div class="kicker">DECISION JOURNAL</div><h2>复盘当时的选择，不追认事后答案。</h2><p>区分没有发现、没有触发、证据不足、没有执行和退出过早。</p></div><a href="/report#review">原有计划复盘 ↗</a></div><div class="review-grid"><div class="panel"><h3>决策与结果</h3>${reviews.length?reviews.map(r=>`<div class="event"><span class="badge">${esc(r.outcome)}</span><p><button class="link" data-card="${r.id}">${esc(r.title)}</button> · 对照 v${r.plan_version}</p><div class="pre">${esc(r.note)}</div><small>${stamp(r.at)} · 用户记录，非券商成交回执</small></div>`).join(''):'<div class="empty"><b>还没有复盘记录</b><p>在研究卡里记录是否触发、为何行动或放弃。没有真实成交数据时，不计算收益率或胜率。</p></div>'}</div><div class="panel"><h3>研究时间线</h3>${board.events.slice().reverse().slice(0,80).map(e=>`<div class="event"><b>${esc(verbs[e.action]||e.action)} · v${e.version}</b><p><button class="link" data-card="${e.card_id}">${esc(e.title)}</button></p><p>${esc(e.note)}</p><small>${stamp(e.at)}</small></div>`).join('')||'<p class="sub">发起第一条研究后开始记录。</p>'}</div></div></section>`}
function render(){route=location.hash.slice(1);if(!names[route])route='today';$('#page-title').textContent=names[route];document.querySelectorAll('[data-route]').forEach(e=>{e.classList.toggle('active',e.dataset.route===route);if(e.dataset.route===route)e.setAttribute('aria-current','page');else e.removeAttribute('aria-current')});$('#app').className='';$('#app').innerHTML=({today,portfolio,lookup,review}[route])();$('#filter')?.addEventListener('input',e=>document.querySelectorAll('.research-item').forEach(item=>item.classList.toggle('hidden',!item.dataset.search.toLowerCase().includes(e.target.value.toLowerCase()))))}
function field(name,label,value='',type='text',wide=false){return `<label class="field ${wide?'wide':''}">${esc(label)}${type==='textarea'?`<textarea name="${name}">${esc(value)}</textarea>`:`<input name="${name}" type="${type}" value="${esc(value)}">`}</label>`}
function openModal(title,html,submit,label='保存',success='已保存，旧版本仍可查看'){modalRevision=board.revision;$('#modal-title').textContent=title;$('#modal-body').innerHTML=`<form id="editor">${html}<div class="form-error" id="form-error" role="alert"></div><div class="modal-foot"><button type="button" id="cancel">取消</button><button class="primary" type="submit">${label}</button></div></form>`;$('#cancel').onclick=()=>$('#modal').close();$('#editor').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{await submit(Object.fromEntries(new FormData(e.target)));$('#modal').close();await load();toast(success)}catch(err){$('#form-error').textContent=err.message;if(err.message.includes('新版本')){await load();$('#form-error').textContent+='。请保留输入，关闭后重新打开。'}}finally{btn.disabled=false}};$('#modal').showModal()}
function codes(text){return text.split(/[，,、\s]+/).filter(Boolean)}
function save(action,extra={}){return api('/api/research-board',{revision:modalRevision,card_id:current()?.id,action,...extra})}
function createModal(){const d=new Date();d.setDate(d.getDate()+7);openModal('发起一条研究',`${field('question','你现在要做什么判断？','','textarea')}${field('title','研究标题（可选）')}<div class="form-grid">${field('keyword','归档检索关键词（如机器人）')}${field('symbols','证券代码（可空，最多3个）')}${field('valid_until','观察到哪一天',d.toLocaleDateString('en-CA'),'date')}</div><p class="sub">方向研究可暂不填写证券代码。先保存研究问题，随后检索现有归档或调用现有 Agent；不会凭空生成交易价格。</p>`,async f=>{const r=await save('create',{...f,symbols:codes(f.symbols)});selected=r.card_id;location.hash='lookup'},'建立研究卡')}
function editModal(){const c=current();openModal('修订预案 · 保留原版本',`${field('title','标题',c.title)}${field('question','研究问题',c.question,'textarea')}<div class="form-grid">${field('keyword','归档检索关键词',c.keyword)}${field('symbols','研究证券代码',c.symbols.join(','))}${field('as_of','价格 / 资料基准日',c.as_of,'date')}${field('valid_until','预案有效至',c.valid_until,'date')}</div>${field('thesis','当前判断与假设',c.thesis,'textarea')}${field('entry','入场前提、确认窗口与追价上限',c.entry,'textarea')}${field('invalidation','失效条件',c.invalidation,'textarea')}${field('exit','退出规则与到期处理',c.exit,'textarea')}${field('related_symbols','关联持仓代码',c.related_symbols.join(','))}${field('holding_relation','资金来源、持仓影响、做T或换仓意图',c.holding_relation,'textarea')}${field('note','为什么修改（必填）','','textarea')}`,f=>save('revise',{...f,symbols:codes(f.symbols),related_symbols:codes(f.related_symbols)}),'保存新版本')}
function materialModal(gapId=''){const c=current();openModal('补充材料 · 接着查',`${field('title','材料标题 / 来源名称')}${field('url','原文链接（补缺口时必填）','','url')}<div class="form-grid">${field('as_of','材料日期',board.today,'date')}<label class="field">材料类型<select name="kind"><option value="unknown">待核验</option><option value="fact">事实（已核原文）</option><option value="inference">推断</option><option value="sentiment">观点 / 情绪</option><option value="rumor">传闻</option></select></label><label class="field">对当前判断的影响<select name="stance"><option value="context">补充背景</option><option value="supports">提供支持</option><option value="opposes">构成反证</option></select></label><label class="field">对应缺口<select name="gap_id"><option value="">只追加，不标记缺口</option>${c.gaps.filter(g=>!g.resolved_by).map(g=>`<option value="${g.id}" ${gapId===g.id?'selected':''}>${esc(g.text)}</option>`).join('')}</select></label></div>${field('text','材料内容、关键数字和口径','','textarea')}<p class="sub">标记缺口表示你已补证，仍保留来源和记录；系统不会因此自动授予买入权。</p>`,f=>save('evidence',f))}
function action(name){const c=current();if(name==='new')return createModal();if(name==='discover')return discoveryModal();if(!c)return;if(name==='filing')return filingModal();if(name==='adopt-filing')return adoptFilingModal();if(name==='change')return changeModal();if(name==='edit')return editModal();if(name==='material')return materialModal();if(name==='freeze')return openModal('冻结当前观察版本',`<div class="alert">当前 v${c.version} · ${c.open_gaps} 项缺口。冻结仅保留此刻的条件与依据，缺口和到期状态不变。</div>${field('note','冻结说明（例如：周一9:25竞价后）','','textarea')}`,f=>save('freeze',f),'保存观察快照');if(name==='gap')return openModal('记录一个证据缺口',field('text','缺什么、影响哪个判断？','','textarea'),f=>save('gap',f));if(name==='status')return openModal('调整跟进状态',`<label class="field">状态<select name="status">${Object.entries(states).map(([k,v])=>`<option value="${k}" ${c.status===k?'selected':''}>${v}</option>`).join('')}</select></label>${field('note','原因（必填）','','textarea')}`,f=>save('status',f));if(name==='review')return openModal('对照预案记录复盘',`<label class="field">本次结果<select name="outcome">${['未触发','缺证据未行动','触发未执行','人工执行待核对','退出过早','假设失效','继续观察'].map(v=>`<option>${v}</option>`).join('')}</select></label>${field('note','当时看到了什么、做了什么、下次改什么？','','textarea')}<p class="sub">当前预案 v${c.version} 将保留在记录中；文字记录不等同券商成交。</p>`,f=>save('review',f));if(name==='collect'||name==='ai'){const mode=name==='ai'?'ai':'offline';return openModal(mode==='ai'?'运行现有 Agent 核验':'检索已有归档',`<p>问题：${esc(c.question)}</p><p>关键词：${esc(c.keyword||'尚未填写')} · 标的：${esc(c.symbols.join(' / ')||'尚未填写')}</p><div class="alert quiet">${mode==='ai'?'沿用现有模型配置。每次最多4次模型请求、120秒、本地估算额度 $0.10；不自动重试。返回草稿需要核验，不自动修改价格或解除缺口。':'读取现有新闻、NGA和雪球归档及已登记行情回执，不调用模型、不重新采集全库。缺行情、无匹配和片段覆盖有限都会保留。'}</div>`,()=>api('/api/research-run',{revision:modalRevision,card_id:c.id,mode}),'开始研究')}}
$('#app').addEventListener('click',e=>{const card=e.target.closest('[data-card]'),sel=e.target.closest('[data-select]'),act=e.target.closest('[data-action]'),gap=e.target.closest('[data-gap]');if(card)openCard(card.dataset.card);if(sel){selected=sel.dataset.select;render()}if(act)action(act.dataset.action);if(gap)materialModal(gap.dataset.gap)});
$('#discover').onclick=discoveryModal;$('#new-research').onclick=createModal;$('#reload').onclick=()=>load().then(()=>toast('已读取最新保存状态；未刷新行情')).catch(e=>toast(e.message));$('#close-modal').onclick=()=>$('#modal').close();window.addEventListener('hashchange',()=>board&&render());
load().catch(e=>{$('#app').className='';$('#app').innerHTML=`<div class="alert">读取失败：${esc(e.message)}。原数据保留，请刷新重试。</div>`});
setInterval(()=>{if((board?.discovery?.status==='running'||board?.cards.some(c=>c.job?.status==='running'))&&!$('#modal').open&&!document.hidden)load().catch(e=>toast(e.message))},4000);
</script>
</body></html>

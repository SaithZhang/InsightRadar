<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PROTOTYPE — InsightRadar 08:30 决策闭环</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111b;
      --panel: #0c1926;
      --panel-2: #102131;
      --panel-3: #15293b;
      --line: rgba(154, 181, 207, .13);
      --line-strong: rgba(154, 181, 207, .26);
      --text: #f4f0e8;
      --muted: #91a4b7;
      --green: #5a8fc7;
      --green-soft: rgba(90, 143, 199, .13);
      --amber: #d6a74a;
      --amber-soft: rgba(214, 167, 74, .13);
      --red: #d94b45;
      --red-soft: rgba(217, 75, 69, .12);
      --blue: #73a9df;
      --warm-white: #f4f0e8;
      --ink: #07111b;
      --shadow: 0 22px 64px rgba(0, 0, 0, .34);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 78% -24%, rgba(45, 92, 137, .22), transparent 39%),
        linear-gradient(180deg, #081521 0, #07111b 58%, #050c13 100%);
      font: 14px/1.55 Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button { font: inherit; }
    button:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 2px;
    }

    .app {
      display: grid;
      grid-template-columns: 214px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 24px 18px;
      border-right: 1px solid var(--line);
      background: rgba(5, 13, 22, .86);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 8px 28px;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: .01em;
    }

    .brand-mark {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(90, 143, 199, .42);
      border-radius: 9px;
      color: var(--blue);
      background: rgba(90, 143, 199, .12);
      box-shadow: inset 0 0 18px rgba(90, 143, 199, .08);
    }

    .nav {
      display: grid;
      gap: 7px;
    }

    .nav button {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 11px;
      color: var(--muted);
      text-align: left;
      background: transparent;
    }

    .nav button.active {
      color: var(--text);
      background: linear-gradient(90deg, rgba(90, 143, 199, .17), rgba(90, 143, 199, .04));
    }

    .nav-icon {
      width: 23px;
      color: var(--green);
      text-align: center;
    }

    .sidebar-note {
      position: absolute;
      right: 18px;
      bottom: 96px;
      left: 18px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--muted);
      font-size: 12px;
      background: rgba(255,255,255,.025);
    }

    .content {
      min-width: 0;
      padding: 24px clamp(20px, 3vw, 46px) 144px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      max-width: 1260px;
      margin: 0 auto 26px;
    }

    .eyebrow {
      color: var(--blue);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .topbar h1 {
      margin: 2px 0 0;
      font-size: clamp(24px, 3vw, 36px);
      line-height: 1.18;
      letter-spacing: -.025em;
    }

    .data-state {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .chip, .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 27px;
      padding: 4px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      background: rgba(255,255,255,.025);
    }

    .chip::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 10px rgba(115, 169, 223, .55);
    }

    .stage {
      max-width: 1260px;
      margin: 0 auto;
    }

    .market-context {
      display: grid;
      gap: 10px;
      margin-bottom: 22px;
    }

    .market-constraint {
      display: grid;
      grid-template-columns: minmax(190px, .85fr) repeat(2, minmax(190px, 1fr)) minmax(150px, .65fr);
      gap: 0;
      align-items: stretch;
      width: 100%;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      text-align: left;
      background: rgba(12, 25, 38, .86);
      overflow: hidden;
    }

    .constraint-summary, .market-driver, .market-confidence {
      min-width: 0;
      padding: 16px 18px;
    }

    .market-driver, .market-confidence {
      border-left: 1px solid var(--line);
    }

    .constraint-summary strong {
      display: block;
      margin: 6px 0 3px;
      font-size: 17px;
      line-height: 1.25;
    }

    .market-constraint small { display: block; color: var(--muted); }
    .market-driver {
      border-top: 0;
      border-right: 0;
      border-bottom: 0;
      color: var(--text);
      text-align: left;
      background: transparent;
      cursor: pointer;
    }
    .market-driver:hover { background: rgba(255,255,255,.025); }
    .market-driver .driver-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .market-driver strong {
      display: block;
      margin: 8px 0 4px;
      font-size: 20px;
      line-height: 1.1;
    }
    .market-driver:first-of-type strong { color: var(--red); }
    .market-driver:last-of-type strong { color: var(--amber); }
    .market-confidence .freshness {
      display: flex;
      gap: 7px;
      align-items: center;
      margin: 7px 0 4px;
      color: var(--blue);
      font-weight: 760;
    }
    .market-confidence .freshness::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 10px rgba(115,169,223,.55);
    }
    .market-constraint .constraint-link {
      display: inline-flex;
      margin-top: 11px;
      padding: 7px 10px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      color: var(--text);
      font-size: 11px;
      background: transparent;
      cursor: pointer;
    }

    .market-strip { display: none; }

    .market-tile {
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      text-align: left;
      background: rgba(12, 25, 38, .82);
      cursor: pointer;
    }

    .market-tile:hover { border-color: var(--line-strong); }
    .market-tile header, .market-tile footer {
      display: flex;
      justify-content: space-between;
      gap: 7px;
      align-items: center;
    }

    .market-tile header strong { font-size: 12px; }
    .market-tile header span {
      overflow: hidden;
      color: var(--amber);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .market-tile .temperature {
      margin: 7px 0 5px;
      font-size: 17px;
      font-weight: 780;
      line-height: 1.1;
    }

    .market-tile footer {
      color: var(--muted);
      font-size: 9px;
    }

    .market-tile .confirm-ok { color: var(--green); }
    .market-tile .confirm-lag { color: var(--amber); }
    .market-tile .confirm-gap { color: var(--red); }

    .decision-heading {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: end;
      margin: 0 0 12px;
    }

    .decision-heading h2 {
      margin: 0;
      color: var(--warm-white);
      font-size: clamp(23px, 2.5vw, 32px);
      line-height: 1.15;
      letter-spacing: -.02em;
    }

    .decision-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .decision-counts {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: flex-end;
      color: var(--muted);
      font-size: 11px;
    }

    .decision-counts strong { color: var(--text); }
    .decision-counts .revised strong { color: var(--amber); }
    .decision-counts .voided strong { color: var(--red); }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(160deg, rgba(16,33,49,.96), rgba(9,20,31,.96));
      box-shadow: var(--shadow);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      padding: 18px 20px 0;
    }

    .panel-head h2, .panel-head h3 { margin: 0; }
    .panel-head p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 750;
    }

    .status.unchanged { color: var(--blue); background: rgba(90,143,199,.12); }
    .status.revised { color: var(--amber); background: var(--amber-soft); }
    .status.void { color: var(--red); background: var(--red-soft); }

    .action-title {
      margin: 14px 0 6px;
      font-size: clamp(20px, 2.4vw, 31px);
      line-height: 1.22;
      letter-spacing: -.02em;
    }

    .rule {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 8px;
      padding: 9px 0;
      border-top: 1px solid var(--line);
    }

    .rule-key {
      color: var(--blue);
      font: 760 11px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .06em;
    }

    .rule.invalid .rule-key { color: var(--red); }
    .rule-value { color: #d9e2eb; }

    .progress {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 13px;
      color: var(--muted);
      font-size: 12px;
    }

    .progress-bars {
      display: grid;
      grid-template-columns: repeat(3, 26px);
      gap: 4px;
    }

    .progress-bars i {
      display: block;
      height: 5px;
      border-radius: 999px;
      background: rgba(255,255,255,.11);
    }

    .progress-bars i.on {
      background: var(--amber);
      box-shadow: 0 0 10px rgba(244,197,108,.28);
    }

    .actions {
      display: flex;
      gap: 9px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .decision-actions {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
    }

    .decision-actions .text-button {
      min-height: 34px;
      padding: 7px 9px;
    }

    .decision-actions .reject {
      color: #e17a74;
    }

    .response-badge {
      display: inline-flex;
      align-items: center;
      min-height: 27px;
      padding: 4px 9px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 760;
      background: rgba(255,255,255,.025);
    }

    .response-badge.accepted { color: var(--blue); background: var(--green-soft); }
    .response-badge.disputed { color: var(--amber); background: var(--amber-soft); }
    .response-badge.rejected { color: #e17a74; background: var(--red-soft); }
    .response-badge.deferred { color: var(--muted); }

    .primary, .secondary, .text-button {
      min-height: 36px;
      padding: 8px 13px;
      border-radius: 10px;
      cursor: pointer;
    }

    .primary {
      border: 1px solid var(--warm-white);
      color: var(--ink);
      font-weight: 760;
      background: var(--warm-white);
    }

    .primary.confirmed {
      border-color: var(--line-strong);
      color: var(--blue);
      background: var(--green-soft);
    }

    .secondary {
      border: 1px solid var(--line-strong);
      color: var(--text);
      background: rgba(255,255,255,.035);
    }

    .text-button {
      border: 0;
      color: var(--muted);
      background: transparent;
    }

    .evidence-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .evidence-tags span {
      padding: 4px 7px;
      border-radius: 7px;
      color: var(--muted);
      font-size: 10px;
      background: rgba(255,255,255,.04);
    }

    [data-tip] {
      position: relative;
      display: inline-grid;
      place-items: center;
      width: 18px;
      height: 18px;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--muted);
      font: 700 11px/1 sans-serif;
      cursor: help;
    }

    [data-tip]::after {
      position: absolute;
      z-index: 20;
      bottom: calc(100% + 9px);
      left: 50%;
      width: 250px;
      padding: 10px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      color: var(--text);
      background: #132638;
      box-shadow: var(--shadow);
      content: attr(data-tip);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 4px);
      transition: .16s ease;
    }

    [data-tip]:hover::after, [data-tip]:focus::after {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .route-stack {
      display: grid;
      gap: 14px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
    }

    .metric-card {
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(12, 25, 38, .82);
    }

    .metric-card small {
      display: block;
      color: var(--muted);
    }

    .metric-card strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
      line-height: 1.1;
    }

    .metric-card em {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      font-style: normal;
    }

    .route-panel { padding: 18px 20px; }

    .route-toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 15px;
    }

    .route-toolbar h2, .route-toolbar h3 { margin: 0; }
    .route-toolbar p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .toolbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .field, .select-field {
      min-height: 38px;
      padding: 8px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 10px;
      color: var(--text);
      background: rgba(4, 13, 22, .66);
    }

    .field::placeholder { color: #6f8279; }
    .field:focus, .select-field:focus { border-color: var(--green); outline: 0; }

    .holdings-table {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
    }

    .holding-head, .holding-row {
      display: grid;
      grid-template-columns: minmax(170px, 1.25fr) 90px 120px minmax(180px, 1.25fr) 112px;
      gap: 12px;
      align-items: center;
    }

    .holding-head {
      padding: 10px 14px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: rgba(255,255,255,.025);
    }

    .holding-row {
      min-height: 76px;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
    }

    .holding-id strong, .holding-plan strong { display: block; }
    .holding-id small, .holding-plan small { color: var(--muted); }
    .holding-weight { font-weight: 760; }
    .holding-risk { color: var(--amber); font-size: 11px; }
    .holding-risk.ready { color: var(--blue); }
    .holding-risk.blocked { color: var(--red); }
    .holding-row .secondary { width: 100%; }

    .universe-note {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      padding: 12px 13px;
      border: 1px solid rgba(140, 191, 243, .25);
      border-radius: 12px;
      color: var(--muted);
      font-size: 11px;
      background: rgba(140, 191, 243, .06);
    }

    .universe-note b { color: var(--blue); }

    .lookup-bar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 8px;
    }

    .lookup-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(330px, .8fr);
      gap: 14px;
    }

    .lookup-chart { padding: 18px 20px; }
    .lookup-chart h2 { margin: 0; }
    .lookup-chart .mini-chart { height: 260px; margin-bottom: 12px; }
    .lookup-chart .mini-chart svg { height: 220px; }

    .benchmark-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin: 10px 0 0;
    }

    .benchmark-pill {
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 10px;
      background: rgba(255,255,255,.025);
    }

    .benchmark-pill.active { border-color: rgba(90,143,199,.48); color: var(--blue); }

    .indicator-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    .indicator {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.022);
    }

    .indicator small { display: block; color: var(--muted); }
    .indicator strong { display: block; margin-top: 3px; font-size: 12px; }
    .indicator .warning { color: var(--amber); }
    .indicator .positive { color: var(--red); }

    .strategy-card { padding: 20px; }
    .strategy-card h2 { margin: 7px 0 12px; font-size: 22px; line-height: 1.25; }
    .strategy-note {
      margin-top: 12px;
      padding: 11px 12px;
      border-left: 3px solid var(--amber);
      color: var(--muted);
      background: var(--amber-soft);
    }

    .review-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .score-panel { padding: 18px 20px; }
    .score-panel header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }
    .score-panel h2 { margin: 0; }
    .score-panel .score { color: var(--blue); font-size: 28px; font-weight: 780; }
    .score-panel ul { margin: 14px 0 0; padding-left: 18px; color: var(--muted); }

    .review-ledger {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
    }

    .review-head, .review-row {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) minmax(160px, 1.15fr) minmax(150px, 1fr) 110px 88px;
      gap: 12px;
      align-items: center;
    }

    .review-head {
      padding: 10px 14px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: rgba(255,255,255,.025);
    }

    .review-row {
      min-height: 75px;
      padding: 12px 14px;
      border-top: 1px solid var(--line);
    }

    .review-row small { color: var(--muted); }
    .review-row .good { color: var(--blue); }
    .review-row .pending { color: var(--amber); }

    .pilot-progress {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 5px;
      margin-top: 12px;
    }

    .pilot-progress i {
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
    }

    .pilot-progress i.done { background: var(--blue); }
    .pilot-progress i.current { background: var(--amber); }

    /* Variant A: selected action brief, one dominant decision plus two compact rows. */
    .variant-a .focus-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .variant-a .primary-plan {
      position: relative;
      padding: 22px 24px 20px;
      border-color: rgba(217, 75, 69, .42);
      background:
        linear-gradient(90deg, rgba(217,75,69,.08), transparent 30%),
        linear-gradient(160deg, rgba(16,33,49,.98), rgba(9,20,31,.97));
      overflow: hidden;
    }

    .variant-a .primary-plan::before {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4px;
      background: var(--red);
      content: "";
    }

    .plan-identity {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
    }

    .decision-number {
      color: var(--red);
      font-size: 24px;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
    }

    .plan-name strong { display: block; }
    .plan-name small { color: var(--muted); }
    .primary-plan .action-title { margin: 12px 0 10px; }

    .rule-set {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(5, 14, 23, .42);
    }

    .rule-set .rule {
      display: block;
      min-width: 0;
      padding: 12px 14px;
      border-top: 0;
      border-left: 1px solid var(--line);
    }

    .rule-set .rule:first-child { border-left: 0; }
    .rule-set .rule-key { display: block; margin-bottom: 7px; }
    .rule-set .rule-value { display: block; font-size: 12px; }

    .variant-a .secondary-stack {
      display: grid;
      gap: 10px;
    }

    .compact-plan {
      display: grid;
      grid-template-columns: 46px minmax(180px, .75fr) minmax(260px, 1.5fr) auto;
      gap: 14px;
      align-items: center;
      padding: 14px 18px;
      box-shadow: none;
    }

    .compact-plan .decision-number { color: var(--blue); font-size: 20px; }
    .compact-plan .action-title { margin: 4px 0 0; font-size: 17px; }
    .compact-plan .compact-rules {
      display: grid;
      gap: 5px;
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
    }
    .compact-plan .compact-rules span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .compact-plan .compact-rules b {
      display: inline-block;
      width: 52px;
      color: var(--blue);
      font: 760 10px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .compact-plan .compact-rules .invalid b { color: var(--red); }
    .compact-plan .compact-actions { display: flex; gap: 8px; align-items: center; }
    .compact-plan .compact-actions .primary,
    .compact-plan .compact-actions .secondary { white-space: nowrap; }

    .morning-footer {
      display: grid;
      grid-template-columns: minmax(220px, .75fr) minmax(180px, .55fr) minmax(260px, 1fr);
      gap: 12px;
      align-items: center;
      margin-top: 12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(9, 20, 31, .74);
    }
    .morning-footer .primary,
    .morning-footer .secondary { min-height: 46px; font-size: 14px; }
    .morning-footer p { margin: 0; color: var(--muted); font-size: 11px; }

    .footer-response-summary {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-wrap: wrap;
    }

    .alert-handoff {
      display: grid;
      grid-template-columns: minmax(180px, .65fr) minmax(250px, 1.35fr) auto;
      gap: 14px;
      align-items: center;
      margin-top: 10px;
      padding: 13px 16px;
      border: 1px solid rgba(115,169,223,.24);
      border-radius: 13px;
      background: rgba(90,143,199,.06);
    }

    .alert-handoff strong { display: block; }
    .alert-handoff small { color: var(--muted); }
    .alert-handoff .alert-state { color: var(--blue); font-weight: 760; }
    .alert-handoff .alert-state.waiting { color: var(--amber); }

    .theme-constraint {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid rgba(214,167,74,.24);
      border-radius: 12px;
      color: var(--muted);
      background: rgba(214,167,74,.055);
    }

    .theme-constraint strong { color: var(--text); }
    .theme-constraint b { color: var(--amber); }

    .market-permission {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0;
    }

    .permission-cell {
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255,255,255,.023);
    }

    .permission-cell small { display: block; color: var(--muted); }
    .permission-cell strong { display: block; margin: 3px 0; }
    .permission-cell em { color: var(--muted); font-size: 10px; font-style: normal; }
    .permission-cell.caution strong { color: var(--amber); }
    .permission-cell.blocked strong { color: var(--red); }

    .backtest-panel {
      padding: 18px 20px;
    }

    .backtest-status {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .backtest-metric {
      min-height: 86px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255,255,255,.022);
    }

    .backtest-metric small { display: block; color: var(--muted); }
    .backtest-metric strong { display: block; margin: 7px 0 2px; font-size: 16px; }
    .backtest-metric em { color: var(--muted); font-size: 10px; font-style: normal; }

    .theme-page {
      display: grid;
      gap: 14px;
    }

    .theme-hero {
      padding: 20px;
    }

    .theme-hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(260px, .8fr);
      gap: 18px;
      align-items: center;
    }

    .theme-score {
      color: var(--amber);
      font-size: clamp(42px, 6vw, 70px);
      font-weight: 790;
      line-height: 1;
      letter-spacing: -.05em;
    }

    .theme-score small {
      color: var(--muted);
      font-size: 15px;
      letter-spacing: 0;
    }

    .theme-rule-card {
      padding: 14px;
      border: 1px solid rgba(214,167,74,.26);
      border-radius: 12px;
      background: var(--amber-soft);
    }

    .theme-rule-card strong { display: block; margin-bottom: 5px; }
    .theme-rule-card p { margin: 0; color: var(--muted); }

    .theme-chart-panel { padding: 18px 20px; }
    .theme-canvas-wrap {
      position: relative;
      height: 330px;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(4,13,22,.5);
      overflow: hidden;
    }

    .theme-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .theme-legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 10px;
      color: var(--muted);
      font-size: 10px;
    }

    .theme-legend span { display: inline-flex; gap: 6px; align-items: center; }
    .theme-legend i {
      width: 18px;
      height: 3px;
      border-radius: 999px;
      background: var(--legend-color);
    }

    .theme-etf-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 14px;
    }

    .theme-etf {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255,255,255,.022);
    }

    .theme-etf.low { border-color: rgba(214,167,74,.28); background: rgba(214,167,74,.055); }
    .theme-etf strong, .theme-etf small { display: block; }
    .theme-etf small { color: var(--muted); }
    .theme-etf b { color: var(--text); font-size: 17px; }
    .theme-etf.low b { color: var(--amber); }

    .objection-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0;
    }

    .objection-option {
      padding: 10px 11px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      text-align: left;
      background: rgba(255,255,255,.025);
      cursor: pointer;
    }

    .objection-option.active {
      border-color: rgba(214,167,74,.55);
      color: var(--text);
      background: var(--amber-soft);
    }

    .objection-note {
      width: 100%;
      min-height: 96px;
      resize: vertical;
    }

    /* Variant B: inbox and selected detail. */
    .variant-b .inbox {
      display: grid;
      grid-template-columns: minmax(260px, .62fr) minmax(0, 1.38fr);
      min-height: 540px;
      overflow: hidden;
    }

    .queue {
      padding: 13px;
      border-right: 1px solid var(--line);
      background: rgba(4, 13, 22, .34);
    }

    .queue-title {
      padding: 8px 9px 13px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .queue-item {
      display: grid;
      grid-template-columns: 8px minmax(0,1fr) auto;
      gap: 10px;
      width: 100%;
      padding: 13px 10px;
      border: 0;
      border-radius: 11px;
      color: var(--text);
      text-align: left;
      background: transparent;
      cursor: pointer;
    }

    .queue-item.active { background: rgba(90, 143, 199, .1); }
    .queue-item .dot { width: 7px; height: 7px; margin-top: 7px; border-radius: 50%; background: var(--green); }
    .queue-item.revised .dot { background: var(--amber); }
    .queue-item.void .dot { background: var(--red); }
    .queue-item strong { display: block; }
    .queue-item small { color: var(--muted); }
    .queue-item time { color: var(--muted); font-size: 10px; }

    .detail-pane { padding: 24px clamp(20px, 3vw, 36px); }
    .detail-pane .rule { max-width: 760px; }

    /* Variant C: scan-first morning checklist. */
    .variant-c .checklist {
      overflow: hidden;
    }

    .checklist-head, .check-row {
      display: grid;
      grid-template-columns: minmax(150px, .7fr) minmax(210px, 1fr) minmax(280px, 1.45fr) 120px;
      gap: 14px;
      align-items: center;
    }

    .checklist-head {
      padding: 11px 18px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .check-row {
      min-height: 112px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
    }

    .check-row:last-child { border-bottom: 0; }
    .security strong { display: block; margin-bottom: 4px; font-size: 15px; }
    .security small { color: var(--muted); }
    .check-action { font-weight: 720; }
    .check-condition { color: #d7e4de; font-size: 12px; }
    .check-condition b { color: var(--green); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .check-controls { display: grid; gap: 7px; }
    .check-controls button { width: 100%; }

    .empty {
      display: grid;
      min-height: 420px;
      place-items: center;
      padding: 40px;
      text-align: center;
    }

    .empty-mark {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border: 1px solid rgba(90,143,199,.3);
      border-radius: 24px;
      color: var(--green);
      font-size: 30px;
      background: var(--green-soft);
    }

    .empty h2 { margin: 0 0 8px; }
    .empty p { max-width: 520px; margin: 0 auto; color: var(--muted); }

    .drawer-backdrop {
      position: fixed;
      z-index: 60;
      inset: 0;
      display: none;
      justify-content: flex-end;
      background: rgba(0, 0, 0, .58);
      backdrop-filter: blur(3px);
    }

    .drawer-backdrop.open { display: flex; }

    .drawer {
      width: min(520px, 92vw);
      height: 100%;
      padding: 24px;
      overflow: auto;
      border-left: 1px solid var(--line-strong);
      background: #0b1713;
      box-shadow: -20px 0 60px rgba(0,0,0,.4);
    }

    .drawer header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: start;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .drawer h2 { margin: 0; }
    .drawer-close {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      background: rgba(255,255,255,.04);
      cursor: pointer;
    }

    .mini-chart {
      display: grid;
      place-items: center;
      height: 170px;
      margin: 18px 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 100% 34px, 52px 100%;
    }

    .mini-chart svg { width: 92%; height: 130px; overflow: visible; }

    .evidence-list {
      display: grid;
      gap: 8px;
      padding: 0;
      list-style: none;
    }

    .evidence-list li {
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #d4e2db;
      background: rgba(255,255,255,.025);
    }

    .temperature-grid {
      display: grid;
      gap: 10px;
      margin: 16px 0;
    }

    .temperature-row {
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr) 74px;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 11px;
    }

    .temperature-row strong {
      color: var(--text);
      text-align: right;
    }

    .temperature-meter {
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
    }

    .temperature-meter i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--amber));
    }

    .proxy-contract {
      display: grid;
      gap: 8px;
      margin: 14px 0;
    }

    .proxy-line {
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,.025);
    }

    .proxy-line b {
      display: block;
      margin-bottom: 2px;
      color: var(--green);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .proxy-line small { color: var(--muted); }

    .prototype-bar {
      position: fixed;
      z-index: 80;
      bottom: 18px;
      left: 18px;
      display: grid;
      gap: 6px;
      width: 178px;
      padding: 7px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 12px;
      color: #fff;
      background: rgba(5, 11, 18, .94);
      box-shadow: 0 18px 50px rgba(0,0,0,.55);
      backdrop-filter: blur(14px);
    }

    .prototype-bar .group {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .prototype-bar button {
      min-width: 34px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 9px;
      color: #dce7e2;
      background: rgba(255,255,255,.055);
      cursor: pointer;
    }

    .prototype-bar button.active {
      border-color: var(--green);
      color: var(--ink);
      font-weight: 760;
      background: var(--green);
    }

    .variant-label {
      min-width: 88px;
      text-align: center;
    }

    .variant-label strong { display: block; font-size: 12px; }
    .variant-label small { color: #94a49d; font-size: 10px; }
    .bar-sep { display: none; }

    .mobile-nav { display: none; }

    @media (max-width: 820px) {
      .app { display: block; }
      .sidebar { display: none; }
      .content { padding: 16px 12px 160px; }
      .topbar { align-items: flex-start; margin-bottom: 18px; }
      .topbar h1 { font-size: 26px; }
      .data-state .chip:nth-child(n+3) { display: none; }
      .market-constraint { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .constraint-summary { grid-column: 1 / -1; }
      .market-driver:first-of-type { border-left: 0; border-top: 1px solid var(--line); }
      .market-driver:last-of-type { border-top: 1px solid var(--line); }
      .market-confidence { grid-column: 1 / -1; border-top: 1px solid var(--line); border-left: 0; }
      .metrics-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .route-toolbar { align-items: flex-start; }
      .holding-head, .review-head { display: none; }
      .holding-row {
        grid-template-columns: 1fr auto;
        gap: 7px 12px;
        padding: 14px;
      }
      .holding-id { grid-column: 1; }
      .holding-weight { grid-column: 2; grid-row: 1; text-align: right; }
      .holding-risk { grid-column: 1 / -1; }
      .holding-plan { grid-column: 1; }
      .holding-row .secondary { grid-column: 2; width: auto; }
      .lookup-grid { grid-template-columns: 1fr; }
      .indicator-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .market-permission { grid-template-columns: 1fr; }
      .review-grid { grid-template-columns: 1fr; }
      .backtest-status { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .theme-hero-grid { grid-template-columns: 1fr; }
      .theme-etf-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .review-row {
        grid-template-columns: 1fr auto;
        gap: 7px 12px;
        padding: 14px;
      }
      .review-row > :nth-child(2), .review-row > :nth-child(3) { grid-column: 1 / -1; }
      .review-row > :nth-child(4) { grid-column: 1; }
      .review-row > :nth-child(5) { grid-column: 2; grid-row: 1; }
      .decision-heading { align-items: flex-start; }
      .decision-counts { max-width: 240px; }
      .variant-a .focus-layout, .variant-b .inbox { grid-template-columns: 1fr; }
      .rule-set { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .rule-set .rule:nth-child(3) { border-left: 0; border-top: 1px solid var(--line); }
      .rule-set .rule:nth-child(4) { border-top: 1px solid var(--line); }
      .compact-plan { grid-template-columns: 38px minmax(170px, .8fr) minmax(220px, 1.2fr); }
      .compact-plan .compact-actions { grid-column: 2 / -1; justify-content: flex-end; }
      .morning-footer { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .morning-footer p { grid-column: 1 / -1; }
      .alert-handoff { grid-template-columns: 1fr auto; }
      .alert-handoff > :nth-child(2) { grid-column: 1 / -1; grid-row: 2; }
      .variant-b .inbox { min-height: auto; }
      .queue { border-right: 0; border-bottom: 1px solid var(--line); }
      .detail-pane { padding: 20px 16px; }
      .checklist-head { display: none; }
      .check-row {
        grid-template-columns: 1fr auto;
        gap: 8px 14px;
        padding: 16px;
      }
      .check-row .security { grid-column: 1; }
      .check-row .check-action { grid-column: 1; }
      .check-row .check-condition { grid-column: 1 / -1; }
      .check-row .check-controls { grid-column: 2; grid-row: 1 / 3; width: 94px; }
      .prototype-bar {
        display: none;
      }
      .variant-label { min-width: 126px; }
      .variant-label small { display: none; }
      .prototype-bar .scenario-label { display: none; }
      .prototype-bar button { padding: 0 8px; min-width: 31px; }
      .mobile-nav {
        position: fixed;
        z-index: 70;
        right: 0;
        bottom: 0;
        left: 0;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        padding: 7px 8px calc(7px + env(safe-area-inset-bottom));
        border-top: 1px solid var(--line);
        background: rgba(5,13,22,.96);
        backdrop-filter: blur(16px);
      }
      .mobile-nav button {
        border: 0;
        color: var(--muted);
        font-size: 10px;
        background: transparent;
      }
      .mobile-nav button.active { color: var(--green); }
    }

    @media (max-width: 470px) {
      .topbar { display: block; }
      .data-state { justify-content: flex-start; margin-top: 12px; }
      .constraint-summary, .market-driver, .market-confidence { padding: 12px; }
      .market-driver, .market-confidence { border-top: 1px solid var(--line); border-left: 0; }
      .market-driver:last-of-type { border-left: 1px solid var(--line); }
      .market-constraint .constraint-link { display: inline-flex; }
      .decision-heading { display: block; }
      .decision-counts { justify-content: flex-start; margin-top: 10px; }
      .route-toolbar { display: block; }
      .toolbar-actions { margin-top: 10px; }
      .lookup-bar { grid-template-columns: 1fr; }
      .lookup-bar .primary { width: 100%; }
      .route-panel, .lookup-chart, .strategy-card, .score-panel { padding: 16px; }
      .variant-a .primary-plan { padding: 19px 16px; }
      .plan-identity { grid-template-columns: 34px minmax(0, 1fr); }
      .plan-identity .status { grid-column: 2; width: max-content; }
      .rule-set { display: block; }
      .rule-set .rule,
      .rule-set .rule:nth-child(3),
      .rule-set .rule:nth-child(4) { border-top: 1px solid var(--line); border-left: 0; }
      .rule-set .rule:first-child { border-top: 0; }
      .compact-plan { grid-template-columns: 34px minmax(0, 1fr); }
      .compact-plan .compact-rules,
      .compact-plan .compact-actions { grid-column: 2; }
      .compact-plan .compact-actions { justify-content: flex-start; flex-wrap: wrap; }
      .morning-footer { display: grid; grid-template-columns: 1fr; }
      .morning-footer p { grid-column: auto; }
      .alert-handoff, .theme-constraint { grid-template-columns: 1fr; }
      .alert-handoff > :nth-child(2) { grid-column: auto; grid-row: auto; }
      .theme-constraint .secondary { width: 100%; }
      .backtest-status, .theme-etf-grid, .objection-options { grid-template-columns: 1fr; }
      .theme-canvas-wrap { height: 270px; }
      .panel-head { padding: 16px 16px 0; }
      .rule { grid-template-columns: 50px minmax(0,1fr); }
      .prototype-bar { width: calc(100vw - 20px); justify-content: center; }
      .bar-sep { display: none; }
      .variant-label { min-width: 110px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">IR</span> InsightRadar</div>
      <nav class="nav" aria-label="主要任务">
        <button class="active" data-route="today"><span class="nav-icon">◎</span>今日计划</button>
        <button data-route="holdings"><span class="nav-icon">◇</span>我的持仓</button>
        <button data-route="lookup"><span class="nav-icon">⌕</span>个股查询</button>
        <button data-route="review"><span class="nav-icon">↺</span>复盘</button>
      </nav>
      <div class="sidebar-note">PROTOTYPE<br>固定脱敏数据 · 无持久化 · 无交易</div>
    </aside>

    <main class="content">
      <header class="topbar">

    function drawThemeChart() {
      const canvas = document.getElementById("theme-chart");
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      const ratio = Math.max(1, window.devicePixelRatio || 1);
      const width = Math.max(320, rect.width);
      const height = Math.max(240, rect.height);
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      const ctx = canvas.getContext("2d");
      ctx.scale(ratio, ratio);
      ctx.clearRect(0, 0, width, height);

      const pad = { left: 46, right: 20, top: 20, bottom: 36 };
      const chartWidth = width - pad.left - pad.right;
      const chartHeight = height - pad.top - pad.bottom;
      const x = index => pad.left + chartWidth * index / (themeSeries.labels.length - 1);
      const y = value => pad.top + chartHeight * (100 - value) / 100;

      ctx.font = '10px "Segoe UI", "Microsoft YaHei", sans-serif';
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      [0, 20, 35, 50, 60, 80, 100].forEach(value => {
        ctx.beginPath();
        ctx.strokeStyle = value === 35 ? "rgba(115,169,223,.62)" : value === 80 ? "rgba(217,75,69,.62)" : "rgba(154,181,207,.12)";
        ctx.setLineDash(value === 35 || value === 80 ? [6, 5] : []);
        ctx.moveTo(pad.left, y(value));
        ctx.lineTo(width - pad.right, y(value));
        ctx.stroke();
        ctx.fillStyle = "#91a4b7";
        ctx.fillText(`${value}`, pad.left - 8, y(value));
      });

      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      themeSeries.labels.forEach((label, index) => {
        if (width < 560 && index % 2 === 1) return;
        ctx.fillStyle = "#91a4b7";
        ctx.fillText(label, x(index), height - pad.bottom + 10);
      });

      const lines = [
        { values: themeSeries.unified, color: "#f4f0e8", width: 3 },
        { values: themeSeries.ai, color: "#d94b45", width: 1.8 },
        { values: themeSeries.cpo, color: "#73a9df", width: 1.8 },
        { values: themeSeries.semiconductor, color: "#d6a74a", width: 1.8 }
      ];
      lines.forEach(line => {
        ctx.beginPath();
        ctx.setLineDash([]);
        ctx.strokeStyle = line.color;
        ctx.lineWidth = line.width;
        line.values.forEach((value, index) => {
          if (index === 0) ctx.moveTo(x(index), y(value));
          else ctx.lineTo(x(index), y(value));
        });
        ctx.stroke();
      });
    }

    function bindStage() {
      const acceptAll = stage.querySelector("[data-accept-all]");
      if (acceptAll) {
        acceptAll.addEventListener("click", () => {
          visiblePlans().forEach(plan => {
            if (responseFor(plan).status === "pending") {
              state.responses.set(plan.id, { status: "accepted", reason: "" });
            }
          });
          render();
        });
      }
      stage.querySelectorAll("[data-plan-response]").forEach(button => {
        button.addEventListener("click", () => {
          const id = button.dataset.planResponse;
          const responseStatus = button.dataset.responseStatus;
          if (responseStatus === "disputed") {
            openResponseDrawer(id);
            return;
          }
          state.responses.set(id, { status: responseStatus, reason: "" });
          render();
        });
      });
      stage.querySelectorAll("[data-detail]").forEach(button => {
        button.addEventListener("click", () => openDrawer(button.dataset.detail));
      });
      stage.querySelectorAll("[data-market-detail]").forEach(button => {
        button.addEventListener("click", () => openMarketDrawer(button.dataset.marketDetail));
      });
      stage.querySelectorAll("[data-theme-detail]").forEach(button => {
        button.addEventListener("click", () => {
          state.route = "theme";
          closeDrawer();
          render();
          window.scrollTo({ top: 0, behavior: "auto" });
        });
      });
      const themeBack = stage.querySelector("[data-theme-back]");
      if (themeBack) {
        themeBack.addEventListener("click", () => {
          state.route = "today";
          render();
          window.scrollTo({ top: 0, behavior: "auto" });
        });
      }
      const themeMethod = stage.querySelector("[data-theme-method]");
      if (themeMethod) themeMethod.addEventListener("click", openThemeMethodDrawer);
      stage.querySelectorAll("[data-select]").forEach(button => {
        button.addEventListener("click", () => {
          state.selected = button.dataset.select;
          render();
        });
      });
      const emptyDetail = stage.querySelector("[data-empty-detail]");
      if (emptyDetail) emptyDetail.addEventListener("click", () => openDrawer("alpha", true));
      const holdingSearch = stage.querySelector("[data-holding-search]");
      if (holdingSearch) {
        holdingSearch.addEventListener("submit", event => {
          event.preventDefault();
          state.holdingQuery = new FormData(holdingSearch).get("query") || "";
          render();
        });
      }
      stage.querySelectorAll("[data-holding-action]").forEach(button => {
        button.addEventListener("click", () => openHoldingAction(button.dataset.holdingAction));
      });
      stage.querySelectorAll("[data-holding-detail]").forEach(button => {
        button.addEventListener("click", () => openHoldingDrawer(button.dataset.holdingDetail));
      });
      const lookupForm = stage.querySelector("[data-stock-lookup]");
      if (lookupForm) {
        lookupForm.addEventListener("submit", event => {
          event.preventDefault();
          const code = String(new FormData(lookupForm).get("code") || "").trim().toUpperCase();
          state.lookupCode = code || "512480";
          render();
        });
      }
      stage.querySelectorAll("[data-review-detail]").forEach(button => {
        button.addEventListener("click", () => openReviewDrawer(button.dataset.reviewDetail));
      });
      const backtestDetail = stage.querySelector("[data-backtest-detail]");
      if (backtestDetail) backtestDetail.addEventListener("click", openBacktestDrawer);
    }

    function render() {
      const route = routeMeta[state.route];
      const plansNow = visiblePlans();
      document.getElementById("page-title").textContent = route.title;
      document.getElementById("page-eyebrow").textContent = route.eyebrow;
      document.getElementById("data-state").innerHTML = route.chips.map(chip => `<span class="chip">${chip}</span>`).join("");
      document.querySelectorAll("[data-route]").forEach(button => {
        button.classList.toggle("active", button.dataset.route === state.route);
      });
      if (state.route === "today") {
        stage.innerHTML = state.variant === "A" ? renderA(plansNow)
          : state.variant === "B" ? renderB(plansNow)
          : renderC(plansNow);
      } else if (state.route === "holdings") {
        stage.innerHTML = renderHoldings();
      } else if (state.route === "lookup") {
        stage.innerHTML = renderLookup();
      } else if (state.route === "review") {
        stage.innerHTML = renderReview();
      } else {
        stage.innerHTML = renderTheme();
      }
      prototypeBar.style.display = state.route === "today" ? "" : "none";
      document.getElementById("variant-name").textContent = variantMeta[state.variant];
      document.getElementById("prototype-state").textContent =
        `${state.scenario}项场景 · 已处理${plansNow.filter(p => responseFor(p).status !== "pending").length}/${plansNow.length}`;
      document.querySelectorAll(".scenario").forEach(button => {
        button.classList.toggle("active", Number(button.dataset.scenario) === state.scenario);
      });
      bindStage();
      if (state.route === "theme") requestAnimationFrame(drawThemeChart);
      writeQuery();
    }

    function openResponseDrawer(id) {
      const plan = plans.find(item => item.id === id) || plans[0];
      const existing = responseFor(plan);
      let selectedReason = existing.reason || "触发条件太严格";
      const reasons = ["触发条件太严格", "触发条件太宽松", "点位需要调整", "大盘判断有异议", "证据缺失或过期", "我不准备执行"];
      document.getElementById("drawer-title").textContent = `${plan.name} · 提出异议`;
      drawerContent.innerHTML = `
        <p style="color:var(--muted)">异议不会改写规则生成版，也不会激活新计划预警。保存后形成一份可追溯的“用户修订请求”。</p>
        <h3>异议类型</h3>
        <div class="objection-options">
          ${reasons.map(reason => `<button class="objection-option ${reason === selectedReason ? "active" : ""}" type="button" data-objection-reason="${reason}">${reason}</button>`).join("")}
        </div>
        <h3>希望怎样调整</h3>
        <textarea class="field objection-note" data-objection-note placeholder="例如：确认根数保留3根，但上证指数应改为收盘跌破地板才否决；请补充对应回测。"></textarea>
        <div class="proxy-contract">
          <div class="proxy-line"><b>当前规则版</b>${plan.ifText}</div>
          <div class="proxy-line"><b>保存后的生效语义</b>本条保持“有异议”，不开启机会型预警；上一份已接受计划继续作为可追溯基线。</div>
        </div>
        <div class="actions">
          <button class="primary" type="button" data-save-objection>保存异议</button>
          <button class="text-button" type="button" data-cancel-objection>取消</button>
        </div>`;
      drawerContent.querySelectorAll("[data-objection-reason]").forEach(button => {
        button.addEventListener("click", () => {
          selectedReason = button.dataset.objectionReason;
          drawerContent.querySelectorAll("[data-objection-reason]").forEach(option => option.classList.toggle("active", option === button));
        });
      });
      drawerContent.querySelector("[data-save-objection]").addEventListener("click", () => {
        const note = drawerContent.querySelector("[data-objection-note]").value.trim();
        state.responses.set(plan.id, { status: "disputed", reason: selectedReason, note });
        closeDrawer();
        render();
      });
      drawerContent.querySelector("[data-cancel-objection]").addEventListener("click", closeDrawer);
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      document.querySelector(".drawer-close").focus();
    }

          <li>恐慌与拥挤分别计算；低情绪不等于低风险。</li>
          <li>境内QDII ETF在08:30尚未开盘，不得冒充海外实时行情。</li>
          <li>规则版本 prototype-market-v1 · AI调用 none</li>
        </ul>`;
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      document.querySelector(".drawer-close").focus();
    }

    function openHoldingDrawer(id) {
      const allRows = [...holdingRows, ...(state.previewAdded ? [{
        id: "h5", code: "000005.EX", name: "刚加入的示例标的", weight: "未知",
        risk: "新加入 · 信息待补", plan: "仅进入资料补全队列", note: "尚未生成持仓动作"
      }] : [])];
      const holding = allRows.find(row => row.id === id) || allRows[0];
      document.getElementById("drawer-title").textContent = `${holding.name} · 持仓详情`;
      drawerContent.innerHTML = `
        <p style="color:var(--muted)">${holding.code} · 权重 ${holding.weight} · ${holding.risk}</p>
        <h3>当前条件计划</h3>
        <div class="rule"><span class="rule-key">IF</span><span class="rule-value">关键位得到3根已完成15分钟K线确认，且市场风险预算未继续降级</span></div>
        <div class="rule"><span class="rule-key">THEN</span><span class="rule-value">${holding.plan}；不自动生成订单</span></div>
        <div class="rule invalid"><span class="rule-key">INVALID</span><span class="rule-value">日线收盘跌破既有失效位，或持仓假设被新证据推翻</span></div>
        <h3>持仓上下文</h3>
        <div class="proxy-contract">
          <div class="proxy-line"><b>位置</b>成本、可用股数与盈亏均保持原始导入状态；缺失字段不会补0。</div>
          <div class="proxy-line"><b>风险</b>${holding.risk}。Beta未知时阻塞账户级风险归因。</div>
          <div class="proxy-line"><b>今日</b>${holding.note}。</div>
        </div>
        <p style="color:var(--muted)">固定脱敏原型数据 · 无交易 · AI调用 none</p>`;
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      document.querySelector(".drawer-close").focus();
    }

    function openHoldingAction(kind) {
      const isAdd = kind === "add";
      document.getElementById("drawer-title").textContent = isAdd ? "添加标的" : "导入持仓";
      drawerContent.innerHTML = isAdd ? `
        <p style="color:var(--muted)">从全市场5,299只标的中搜索。加入后只进入本地持仓资料补全队列，不自动生成交易动作。</p>
        <label for="demo-add-code">股票代码</label>
        <input id="demo-add-code" class="field" style="width:100%;margin:8px 0 12px" value="000005.EX">
        <div class="proxy-contract">
          <div class="proxy-line"><b>必填</b>代码、名称、是否实际持有</div>
          <div class="proxy-line"><b>风险字段</b>权重与Beta可以暂时未知，但会阻塞账户级结论</div>
        </div>
        <button class="primary" type="button" data-demo-add>加入本次原型</button>` : `
        <p style="color:var(--muted)">支持多种入口，但生产版仍必须“预览差异 → 用户确认 → 原子保存”。</p>
        <div class="proxy-contract">
          <div class="proxy-line"><b>券商文件</b>TSV / CSV / XLSX，保留原始空字段</div>
          <div class="proxy-line"><b>粘贴导入</b>复制券商持仓表，先解析后预览</div>
          <div class="proxy-line"><b>结构化导入</b>JSON接口为后续Redis/MySQL迁移保留</div>
          <div class="proxy-line"><b>手工录入</b>少量标的逐只添加</div>
        </div>
        <button class="secondary" type="button" data-demo-import>查看差异预览</button>`;
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      const addButton = drawerContent.querySelector("[data-demo-add]");
      if (addButton) {
        addButton.addEventListener("click", () => {
          state.previewAdded = true;
          closeDrawer();
          render();
        });
      }
      const importButton = drawerContent.querySelector("[data-demo-import]");
      if (importButton) {
        importButton.addEventListener("click", () => {
          importButton.textContent = "✓ 预览：新增1、变更2、移除0（未保存）";
          importButton.classList.add("confirmed");
        });
      }
      document.querySelector(".drawer-close").focus();
    }

    function openReviewDrawer(id) {
      const row = reviewRows.find(item => item.id === id) || reviewRows[0];
      document.getElementById("drawer-title").textContent = `${row.name} · 复盘依据`;
      drawerContent.innerHTML = `
        <h3>盘前声明</h3>
        <p>${row.plan}</p>
        <h3>盘中事实</h3>
        <p>${row.event}</p>
        <div class="proxy-contract">
          <div class="proxy-line"><b>执行质量</b>${row.execution}。只判断有没有遵守已确认计划。</div>
          <div class="proxy-line"><b>策略质量</b>${row.outcome}。等待声明周期结束后再评价。</div>
          <div class="proxy-line"><b>禁止后见之明</b>不用收盘后才知道的价格重写盘前规则。</div>
        </div>
        <h3>观察窗口</h3>
        <ul class="evidence-list">
          <li>T+1：短期方向与最大不利波动</li>
          <li>T+5：条件策略的主要评价窗口</li>
          <li>T+20：只评估中期假设，不替代T+5结果</li>
        </ul>`;
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      document.querySelector(".drawer-close").focus();
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
    }

    function cycle(delta) {
      if (state.route !== "today") return;
      const keys = Object.keys(variantMeta);
      const index = keys.indexOf(state.variant);
      state.variant = keys[(index + delta + keys.length) % keys.length];
      render();
    }

    document.querySelectorAll("[data-route]").forEach(button => {
      button.addEventListener("click", () => {
        state.route = button.dataset.route;
        closeDrawer();
        render();
        window.scrollTo({ top: 0, behavior: "auto" });
      });
    });
    document.getElementById("prev").addEventListener("click", () => cycle(-1));
    document.getElementById("next").addEventListener("click", () => cycle(1));
    document.querySelectorAll(".scenario").forEach(button => {
      button.addEventListener("click", () => {
        state.scenario = Number(button.dataset.scenario);
        state.responses.clear();
        state.selected = "alpha";
        render();
      });
    });
    document.querySelector(".drawer-close").addEventListener("click", closeDrawer);
    drawer.addEventListener("click", event => {
      if (event.target === drawer) closeDrawer();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeDrawer();
      const tag = document.activeElement && document.activeElement.tagName;
      if (["INPUT", "TEXTAREA"].includes(tag) || document.activeElement?.isContentEditable) return;
      if (event.key === "ArrowLeft") cycle(-1);
      if (event.key === "ArrowRight") cycle(1);
    });
    window.addEventListener("resize", () => {
      if (state.route === "theme") requestAnimationFrame(drawThemeChart);
    });

    readQuery();
    render();
  </script>
</body>
</html>

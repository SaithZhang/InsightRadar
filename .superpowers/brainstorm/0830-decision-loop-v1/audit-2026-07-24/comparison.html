<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InsightRadar Design QA Comparison</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      color: #f4f0e8;
      background: #050c13;
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    h1 { margin: 0 0 18px; font-size: 22px; }
    .comparison {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    figure { margin: 0; }
    figcaption {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: #91a4b7;
    }
    img {
      display: block;
      width: 100%;
      height: 480px;
      object-fit: contain;
      object-position: top center;
      border: 1px solid rgba(154, 181, 207, .26);
      border-radius: 10px;
      background: #07111b;
    }
  </style>
</head>
<body>
  <h1>行动简报：选定视觉稿与浏览器实现</h1>
  <div class="comparison">
    <figure>
      <figcaption><strong>视觉目标</strong><span>1536 × 1024</span></figcaption>
      <img src="../selected-action-brief-blue-red.png" alt="选定的蓝黑朱红行动简报视觉稿">
    </figure>
    <figure>
      <figcaption><strong>浏览器实现</strong><span>1440 × 1024 viewport</span></figcaption>
      <img src="./06-today-blue-red.png" alt="浏览器渲染的行动简报实现">
    </figure>
  </div>
</body>
</html>

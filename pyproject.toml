[project]
name = "insight-radar"
version = "0.1.0"
description = "A research-grade market insight workstation with AmazingData-backed data sources."
requires-python = ">=3.10"
dependencies = [
  "AmazingData>=1.1.8",
  "pandas",
  "pypdf",
  "report-cli",
  "requests",
  "tables",
  "tgw>=1.0.8.7",
  "twitter-cli>=0.8.5",
]

[project.scripts]
insight-radar = "stock_assist.cli:main"
shenyan-radar = "stock_assist.cli:main"
stock-assist = "stock_assist.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["stock_assist*"]

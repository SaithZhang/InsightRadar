server.address=127.0.0.1
server.port=${API_PORT:18080}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:15432/insightradar_v002}
spring.datasource.username=${DB_USER:insightradar}
spring.datasource.password=${DB_PASSWORD:local-development-only}
spring.datasource.hikari.maximum-pool-size=4
spring.flyway.enabled=true
server.error.include-message=never
spring.mvc.problemdetails.enabled=false
app.python=${BRIDGE_PYTHON:../.venv/bin/python}
app.bridge=${BRIDGE_PATH:../bridge/baostock_bridge.py}
app.data=${DATA_DIR:../data}
app.llm.url=${LLM_BASE_URL:}
app.llm.key=${LLM_API_KEY:}
app.llm.model=${LLM_MODEL:}
app.llm.proxy=${LLM_HTTP_PROXY:}
app.llm.monthly-budget=${LLM_MONTHLY_BUDGET_USD:100}
app.disclosure.max-pdfs=${DISCLOSURE_MAX_PDFS:8}
logging.level.root=INFO
